<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Application web pour gérer le calendrier et les congés des employés.">
    <title>Gestion du Calendrier et Congés - NovaSphere</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-calendar-leave-mang">
    <header class="background-section">
        <h1>Gestion du Calendrier et Congés</h1>
    </header>

    <!-- Contenu principal -->
    <main class="container">
        <!-- Section Calendrier -->
        <div class="calendar">
            <h2>Calendrier</h2>
            <div class="calendar-header">
              <div>Lun</div>
              <div>Mar</div>
              <div>Mer</div>
              <div>Jeu</div>
              <div>Ven</div>
              <div>Sam</div>
              <div>Dim</div>
            </div>
            <div class="calendar-grid">
              <div class="calendar-day">30</div>
              <div class="calendar-day">31</div>
              <div class="calendar-day">1</div>
              <div class="calendar-day">2</div>
              <div class="calendar-day">3</div>
              <div class="calendar-day">4</div>
              <div class="calendar-day">5</div>
              <div class="calendar-day">6</div>
              <div class="calendar-day current-date">7</div>
              <div class="calendar-day">8</div>
              <div class="calendar-day">9</div>
              <div class="calendar-day">10</div>
              <div class="calendar-day">11</div>
              <div class="calendar-day">12</div>
              <div class="calendar-day">13</div>
              <div class="calendar-day">14</div>
              <div class="calendar-day">15</div>
              <div class="calendar-day">16</div>
              <div class="calendar-day">17</div>
              <div class="calendar-day">18</div>
              <div class="calendar-day">19</div>
              <div class="calendar-day">20</div>
              <div class="calendar-day">21</div>
              <div class="calendar-day">22</div>
              <div class="calendar-day">23</div>
              <div class="calendar-day">24</div>
              <div class="calendar-day">25</div>
              <div class="calendar-day">26</div>
              <div class="calendar-day">27</div>
              <div class="calendar-day">28</div>
              <div class="calendar-day">29</div>
              <div class="calendar-day">30</div>
              <div class="calendar-day">31</div>
            </div>
          </div>
        <!-- Section Gestion des Congés -->
        <section class="leave-management">
            <h2>Gestion des Congés</h2>
            <form action="/submit-leave" method="POST">
                <div class="form-group">
                    <label for="leave-type">Type de Congé :</label>
                    <select id="leave-type" name="leave-type" required>
                        <option value="vacances">Vacances</option>
                        <option value="maladie">Maladie</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="start-date">Date de Début :</label>
                    <input type="date" id="start-date" name="start-date" required>
                </div>

                <div class="form-group">
                    <label for="end-date">Date de Fin :</label>
                    <input type="date" id="end-date" name="end-date" required>
                </div>

                <button type="submit" class="btn">Soumettre la Demande de Congé</button>
            </form>
        </section>

        <p><a href="index.html" class="return-link">Retour à l'accueil</a></p>
    </main>

    <!-- Pied de page -->
    <footer>
        <div class="social-icons">
            <a href="https://www.instagram.com/votre_nom" title="Instagram" target="_blank">📸</a>
            <a href="https://www.facebook.com/profile.php?id=61571533354295" title="Facebook" target="_blank">📘</a>
            <a href="https://www.linkedin.com/in/rana-smichi-046883245/" title="LinkedIn" target="_blank">🔗</a>
        </div>
        <p>&copy; 2025 NovaSphere. Tous droits réservés.</p>
    </footer>
    
</body>
</html>
