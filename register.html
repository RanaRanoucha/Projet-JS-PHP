<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - NovaSphere</title>
    <link rel="stylesheet" href="styles.css">
    <body class="page-register">
    <header class="background-section">
    </header>

    <main>
        <div class="container">
            <form action="/submit-registration" method="POST">
                <div class="form-group">
                    <label for="first-name">Prénom :</label>
                    <input type="text" id="first-name" name="first-name" placeholder="Entrez votre prénom" required>
                </div>

                <div class="form-group">
                    <label for="last-name">Nom :</label>
                    <input type="text" id="last-name" name="last-name" placeholder="Entrez votre nom" required>
                </div>

                <div class="form-group">
                    <label for="email">Adresse e-mail :</label>
                    <input type="email" id="email" name="email" placeholder="Entrez votre e-mail" required>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="password" placeholder="Entrez un mot de passe" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmer le mot de passe :</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirmez votre mot de passe" required>
                </div>

                <div class="form-group">
                    <label for="phone">Numéro de téléphone (optionnel) :</label>
                    <input type="tel" id="phone" name="phone" placeholder="Entrez votre numéro de téléphone">
                </div>

                <button type="submit" class="btn">S'inscrire</button>
            </form>
            <p><a href="index.html">Retour à l'accueil</a></p>
            <p><a href="login.html">Retour pour vous connecter</a></p>
        </div>
    </main>

    <footer>
        <div class="social-icons">
            <a href="https://www.instagram.com/votre_nom" title="Instagram" target="_blank">📸</a>
            <a href="https://www.facebook.com/profile.php?id=61571533354295" title="Facebook" target="_blank">📘</a>
            <a href="https://www.linkedin.com/in/rana-smichi-046883245/" title="LinkedIn" target="_blank">🔗</a>
        </div>
        <p>&copy; 2025 NovaSphere. Tous droits réservés.</p>
    </footer>
    
</body>
</html>
