<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser le Mot de Passe - NovaSphere</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="background-section">
    <h1>Réinitialiser le Mot de Passe</h1>
  </header>

  <main class="container">
    <form action="/reset-password" method="POST">
      <div class="form-group">
        <label for="email">Adresse e-mail :</label>
        <input type="email" id="email" name="email" placeholder="Entrez votre e-mail" required>
      </div>

      <div class="form-group">
        <label for="new-password">Nouveau mot de passe :</label>
        <input type="password" id="new-password" name="new-password" placeholder="Entrez un nouveau mot de passe" required>
      </div>

      <div class="form-group">
        <label for="confirm-new-password">Confirmer le nouveau mot de passe :</label>
        <input type="password" id="confirm-new-password" name="confirm-new-password" placeholder="Confirmez le nouveau mot de passe" required>
      </div>

      <button type="submit" class="btn">Réinitialiser le mot de passe</button>
    </form>
    <p><a href="register.html">Retour pour s'inscrire</a></p>
  </main>

  <footer>
    <div class="social-icons">
        <a href="https://www.instagram.com/votre_nom" title="Instagram" target="_blank">📸</a>
        <a href="https://www.facebook.com/profile.php?id=61571533354295" title="Facebook" target="_blank">📘</a>
        <a href="https://www.linkedin.com/in/rana-smichi-046883245/" title="LinkedIn" target="_blank">🔗</a>
    </div>
    <p>&copy; 2025 NovaSphere. Tous droits réservés.</p>
</footer>

</body>
</html>
